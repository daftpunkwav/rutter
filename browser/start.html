<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0; height: 100vh; display: grid; place-content: center;
      text-align: center; gap: 10px;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #1f2733;
      background: linear-gradient(180deg, #fbfcfe, #eef3f8);
    }
    h1 { margin: 0; font-size: 34px; letter-spacing: 0.5px; }
    h1 span { color: #2b6cb0; }
    p { margin: 0; color: #5b6675; max-width: 560px; }
    code { background: #e6e9ee; padding: 1px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>rutter <span>browser</span></h1>
  <p>A pure page surface: agents drive it over CDP, humans drive it with
     the address bar.</p>
  <p>Press <code>F12</code> for DevTools &middot; type an address above to
     start.</p>
</body>
</html>
