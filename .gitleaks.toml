# gitleaks configuration. Extends the default rule set. One targeted
# acceptance: the dashboard HTTP-flow test uses the RFC 6455 documented
# example key (dGhlIHNhbXBsZSBub25jZQ==, "the sample nonce") as a
# sec-websocket-key fixture - a public constant, not a secret. The allowlist
# requires BOTH the fixture path AND that exact value (condition = "AND"),
# so any other credential in the tests tree stays loud.

[extend]
useDefault = true

[[allowlists]]
description = "RFC 6455 example key used as the websocket handshake fixture"
condition = "AND"
paths = ['''crates/dashboard/tests/''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
