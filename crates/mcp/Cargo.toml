# rutter-mcp: the MCP host and tool surface.

[package]
name = "rutter-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP tool surface for rutter (rmcp)"

[lints]
workspace = true

[dependencies]
rutter-core = { workspace = true }
rutter-session = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
# rmcp::schemars::JsonSchema derive expands to `schemars::` paths;
# the crate must be declared directly for name resolution.
schemars = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Tests may use a scripted engine launcher for the session lifecycle.
# Engine types reach production code only through rutter-session's
# re-exports, so rutter-engine is a test-only dependency here.
[dev-dependencies]
async-trait = { workspace = true }
rutter-engine = { workspace = true }
rutter-policy = { workspace = true }
