# rutter-observe: pure conversion from page-script responses to
# snapshots and markdown readouts.

[package]
name = "rutter-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Builds token-budgeted snapshots and markdown readouts from serialized page content"

[lints]
workspace = true

[dependencies]
rutter-core = { workspace = true }
serde_json = { workspace = true }

# Test targets link [dependencies] too, so serde_json needs no second
# dev-dependencies entry.
[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
