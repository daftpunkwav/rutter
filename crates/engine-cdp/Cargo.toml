# rutter-engine-cdp: the only crate that speaks CDP.

[package]
name = "rutter-engine-cdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CDP engine backend for rutter (chromiumoxide)"

[lints]
workspace = true

[dependencies]
rutter-core = { workspace = true }
rutter-engine = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chromiumoxide = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
# The engine spawn is rutter's own (chromiumoxide's spawner runs
# children in a job object that full Chrome cannot start in).
tokio = { workspace = true, features = ["process"] }
