# rutter-engine-cdp: the only crate that speaks CDP.

[package]
name = "rutter-engine-cdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CDP engine backend for rutter (chromiumoxide)"

[lints]
workspace = true

[dependencies]
rutter-core = { workspace = true }
rutter-engine = { workspace = true }
# Production code evaluates the in-page scripts (page.rs), and the
# read tests convert their responses with the same pure layer; test
# targets link [dependencies], so no second dev-dependencies entry.
rutter-observe = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chromiumoxide = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
# The engine spawn is rutter's own (chromiumoxide's spawner reads the
# websocket address from the child's stderr, which launcher-style
# executables close when they relay and exit).
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
# The isolation fallback test dials a fake CDP endpoint that refuses
# browser-context creation the way the Electron engine does; it rides
# the same websocket stack the real connection uses.
async-tungstenite = { workspace = true }
# TcpListener for the fake endpoint.
tokio = { workspace = true, features = ["net"] }
