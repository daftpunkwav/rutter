# rutter-engine-cdp: the only crate that speaks CDP.

[package]
name = "rutter-engine-cdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CDP engine backend for rutter (chromiumoxide)"

[lints]
workspace = true

[dependencies]
rutter-core = { workspace = true }
rutter-engine = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chromiumoxide = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
# The engine spawn is rutter's own (chromiumoxide's spawner runs
# children in a job object that full Chrome cannot start in).
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
# The isolation fallback test dials a fake CDP endpoint that refuses
# browser-context creation the way the Electron engine does; it rides
# the same websocket stack the real connection uses.
async-tungstenite = { version = "0.32", features = ["tokio-runtime", "handshake"] }
# The read test converts the reader script's response with the pure
# observation layer.
rutter-observe = { workspace = true }
# TcpListener for the fake endpoint.
tokio = { workspace = true, features = ["net"] }
