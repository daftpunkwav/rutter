# rutter-dashboard: the supervision dashboard (localhost only).

[package]
name = "rutter-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local supervision dashboard for rutter: events, approvals"

[lints]
workspace = true

[dependencies]
rutter-core = { workspace = true }
rutter-events = { workspace = true }
rutter-policy = { workspace = true }
rutter-session = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Tests stub the manager's launcher; engine types reach production code
# only through rutter-session's re-exports. The access hand-off test
# needs a directory it owns. The flow tests run the real server and
# drive its HTTP routes and WebSocket loop over loopback.
[dev-dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
rutter-engine = { workspace = true }
tempfile = { workspace = true }
# The flow tests dial the dashboard's own WebSocket route with a real
# client, so they need the connect feature. axum's `ws` feature pulls
# the same one in today; asking for it here states the requirement
# instead of inheriting it from another crate's feature set.
tokio-tungstenite = { workspace = true, features = ["connect"] }
