# rutter: the binary. Entry modes and process lifecycle.

[package]
name = "rutter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless browser orchestration service for AI agents"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
rutter-core = { workspace = true }
rutter-dashboard = { workspace = true }
rutter-engine = { workspace = true }
rutter-engine-cdp = { workspace = true }
rutter-mcp = { workspace = true }
rutter-observe = { workspace = true }
rutter-policy = { workspace = true }
rutter-session = { workspace = true }
rmcp = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
# The e2e tests spawn `rutter serve` as a child process.
tokio = { workspace = true, features = ["process"] }
# The e2e tests drive the server as an MCP client over child-process
# stdio and streamable HTTP; client transports stay out of the
# production feature set.
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
