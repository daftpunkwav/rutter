# rutter: the binary. Entry modes and process lifecycle.

[package]
name = "rutter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless browser orchestration service for AI agents"

# The library target carries the modules so tests/ and the thin binary
# share one crate; the binary itself only parses arguments and calls
# `rutter_cli::entry::run`.
[lib]
name = "rutter_cli"
path = "src/lib.rs"

[[bin]]
name = "rutter"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
rutter-core = { workspace = true }
rutter-dashboard = { workspace = true }
rutter-engine = { workspace = true }
rutter-engine-cdp = { workspace = true }
rutter-mcp = { workspace = true }
rutter-observe = { workspace = true }
rutter-policy = { workspace = true }
rutter-session = { workspace = true }
rmcp = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The one-shot engine double answers `evaluate` with an envelope, so
# the test needs the JSON value type the page scripts return.
serde_json = { workspace = true }
# Policy fixtures: a scratch file the harness names and removes, rather
# than a predictable path in the shared temp dir that another local
# user could have planted a symlink at.
tempfile = { workspace = true }
