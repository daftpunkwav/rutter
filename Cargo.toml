# rutter workspace manifest. Crates materialize with the milestone that
# needs them (blueprint §10); empty crates are forbidden.

[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/engine",
    "crates/observe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
rutter-core = { path = "crates/core" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Lint policy (blueprint §8.4): no unwrap/expect/panic outside tests and
# process init, no placeholder markers, public items documented.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
