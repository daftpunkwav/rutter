# rutter workspace manifest. Crates materialize with the milestone that
# needs them (blueprint §10); empty crates are forbidden.

[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/dashboard",
    "crates/engine",
    "crates/engine-cdp",
    "crates/events",
    "crates/mcp",
    "crates/observe",
    "crates/policy",
    "crates/session",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

# Packaging via cargo-dist (blueprint §10, M3): `cargo dist build`
# produces the rutter binary archives; tagging a release triggers the
# publish workflow. The engine is not bundled — rutter downloads the
# Chrome for Testing binary into its cache on first use.
[dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "skip"

[workspace.dependencies]
rutter-core = { path = "crates/core" }
rutter-dashboard = { path = "crates/dashboard" }
rutter-engine = { path = "crates/engine" }
rutter-engine-cdp = { path = "crates/engine-cdp" }
rutter-events = { path = "crates/events" }
rutter-mcp = { path = "crates/mcp" }
rutter-observe = { path = "crates/observe" }
rutter-policy = { path = "crates/policy" }
rutter-session = { path = "crates/session" }
axum = { version = "0.8", features = ["ws"] }
rmcp = { version = "3.4", features = ["server", "client", "macros", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["std"] }
insta = "1"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.0"
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Lint policy (blueprint §8.4): no unwrap/expect/panic outside tests and
# process init, no placeholder markers, public items documented.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
