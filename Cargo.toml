# rutter workspace manifest. Empty crates are forbidden.

[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/dashboard",
    "crates/engine",
    "crates/engine-cdp",
    "crates/events",
    "crates/mcp",
    "crates/observe",
    "crates/policy",
    "crates/session",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV tracks the highest rust-version among locked dependencies
# (rmcp 3.4 / time 0.3.55 require 1.88).
rust-version = "1.88"
license = "Apache-2.0"
# Binary distribution via cargo-dist archives; nothing is published to
# crates.io, which also lets cargo-deny exempt intra-workspace path
# dependencies from the wildcard-version deny.
publish = false

# Packaging via cargo-dist: `cargo dist build`
# produces the rutter binary archives (no release workflow is checked
# in). The engine is not bundled — rutter downloads the
# Chrome for Testing binary into its cache on first use. The metadata
# table name is what cargo-dist reads; a bare `[dist]` would draw an
# "unused manifest key" warning from cargo on every build.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "skip"

[workspace.dependencies]
rutter-core = { path = "crates/core" }
rutter-dashboard = { path = "crates/dashboard" }
rutter-engine = { path = "crates/engine" }
rutter-engine-cdp = { path = "crates/engine-cdp" }
rutter-events = { path = "crates/events" }
rutter-mcp = { path = "crates/mcp" }
rutter-observe = { path = "crates/observe" }
rutter-policy = { path = "crates/policy" }
rutter-session = { path = "crates/session" }
axum = { version = "0.8", features = ["ws"] }
# Server-side surface only: stdio (transport-io) + streamable HTTP.
# The client-side transports are test-only: the root tests/ package
# and crates/mcp add them in their dev-dependencies — only tests
# speak MCP as a client.
rmcp = { version = "3.4", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
chromiumoxide = "0.9"
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["std"] }
insta = "1"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
# Needed by name: rmcp::schemars::JsonSchema derive expands to
# `schemars::` paths, so rutter-mcp must declare the crate itself.
schemars = "1.0"
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
# Dashboard tests drive the real WebSocket loop over loopback.
tokio-tungstenite = { version = "0.29", default-features = false }
toml = "0.8"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Lint policy: no unwrap/expect/panic outside tests and
# process init, no placeholder markers, public items documented.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
