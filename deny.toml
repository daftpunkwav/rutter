# cargo-deny configuration: advisories, licenses, bans, and sources.
# The license allowlist accepts the permissive licenses commonly used by
# Rust ecosystem dependencies.

[advisories]
yanked = "deny"

[licenses]
# CDLA-Permissive-2.0: webpki-roots root-store data (via reqwest
# rustls-tls). Unicode-DFS-2016 dropped: current unicode crates use
# Unicode-3.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are wired together with version-less
# path dependencies by design; only third-party wildcard version
# requirements are denied. cargo-deny >=0.18 dropped [bans] `workspace`
# in favor of this flag.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
