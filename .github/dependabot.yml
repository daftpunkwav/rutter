# Dependabot configuration.
#
# The github-actions entry is the important one: every "uses:" in the workflows is
# pinned to a full commit SHA, and this is what keeps those pins current without
# anyone hand-editing them. Tag-based refs (dtolnay/rust-toolchain@<version>,
# taiki-e/install-action@<branch>) are intentionally left unpinned - pinning those
# would freeze the toolchain and break the msrv/stable gates.
#
# Updates are grouped so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Their "version" is a toolchain or binary name, not an action release
      # (rust-toolchain@1.88.0 pins the MSRV). Dependabot still bumps
      # version-looking refs and produces PRs that cannot pass CI, e.g. it
      # tried to install the nonexistent rust 1.120.0 in PR #6.
      - dependency-name: "dtolnay/rust-toolchain"
      - dependency-name: "taiki-e/install-action"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-rs)"
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/browser"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-js)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm:
        patterns: ["*"]