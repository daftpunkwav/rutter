# Dependabot configuration.
#
# The github-actions entry is the important one: every "uses:" in the workflows is
# pinned to a full commit SHA, and this is what keeps those pins current without
# anyone hand-editing them.
#
# The npm group keeps the Electron shell's pin fresh; the cargo groups keep the
# workspace's lock-driven dependency set fresh.
#
# Updates are grouped so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Both are pinned to a commit SHA like every other action, but the
      # SHA's "version" is not a release dependabot can reason about:
      # dtolnay/rust-toolchain publishes a moving `v1`, and
      # taiki-e/install-action's tool-name refs are regenerated per
      # release (its security note warns against hash-pinning those).
      # What each action actually installs comes from its `toolchain:` /
      # `tool:` input, so these two pins are reviewed and refreshed by
      # hand rather than by an automated bump.
      - dependency-name: "dtolnay/rust-toolchain"
      - dependency-name: "taiki-e/install-action"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-rs)"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Minor and patch bumps travel together; major bumps open one
      # PR each so every breaking change gets its own review and a
      # bisectable diff.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/browser"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-js)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm:
        patterns: ["*"]