# Continuous integration: the release gates run on every push, pull
# request, and a weekly drift probe. The scheduled run exercises main
# against the moving outside world — crates.io state, runner images,
# engine downloads — while nothing is being merged. The engine jobs
# share one composite action (engine cache + Linux engine
# dependencies); the integration and e2e jobs drive the real Chrome
# for Testing engine, and the coverage job measures the whole
# workspace — engine suites and e2e included — against the 90 % line
# threshold of scripts/check_coverage.sh.
#
# Pull requests are triaged first: a docs-only change (markdown,
# license, git metadata) skips the cargo machinery and still passes
# the fast gates job, while any code, script, or CI-definition file
# runs the full set.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled / unlabeled carry the maintainer key that unlocks the
    # expensive tier-2 jobs (see the full-approval guard below).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    # Monday 06:23 UTC, off the top-of-hour thundering herd. Schedule
    # runs are not pull requests, so the path triage passes everything
    # through.
    - cron: "23 6 * * 1"

# An updated pull_request run cancels the superseded one; push runs
# queue behind the running one instead, and finished jobs keep their
# results.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull-request path triage. The compare API is used directly so no
  # checkout is needed. A job skipped via `if` reports the "skipped"
  # conclusion, which satisfies the required-checks ruleset; on push
  # and schedule events the outputs stay empty, and the `always()` in
  # the dependents' conditions makes empty pass through — a triage
  # failure fails open the same way.
  changes:
    name: triage changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.triage.outputs.rust }}
      js: ${{ steps.triage.outputs.js }}
    steps:
      - name: Triage
        id: triage
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A 300-file-capped compare counts as code so pagination can
          # never silently skip a build.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
            --jq 'if .truncated then "TRUNCATED" else .files | map(.filename) | join("\n") end')
          # The docs-only set: markdown anywhere (the README.zh.md
          # mirrors), plain text, license and git metadata. Everything
          # else — including .github/ and scripts/ — is code.
          if [ -n "$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$|\.txt$|^(LICENSE|\.gitignore|\.gitattributes)$')" ]; then
            rust=true
          else
            rust=false
          fi
          if printf '%s\n' "$files" | grep -q '^browser/'; then js=true; else js=false; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "js=$js" >> "$GITHUB_OUTPUT"

  title:
    name: pr title (conventional)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          # Mirrors the workspace git conventions: allowed type,
          # optional parenthesised scope, non-empty subject, no
          # trailing period. Length is left to review because
          # Dependabot's grouped summaries legitimately run past the
          # 72-character subject limit.
          printf '%s\n' "$TITLE" \
            | grep -qE '^(feat|fix|docs|refactor|chore|test|perf|ci)(\([^)]+\))?!?: [^ ]' \
            || { echo "not a conventional title: $TITLE" >&2
                 echo "expected <type>(<scope>)?: <subject> with type in" \
                      "feat|fix|docs|refactor|chore|test|perf|ci" >&2
                 exit 1; }
          case "$TITLE" in
            *. | *' ')
              echo "title must not end with a period or a space: $TITLE" >&2
              exit 1 ;;
          esac

  # The fast hygiene gates: pure bash and node, no toolchain, no
  # cache. They run on every pull request — docs-only changes
  # especially, since byte hygiene and headers are exactly what those
  # touches put at risk — and on every push and schedule run.
  gates:
    name: header, encoding, javascript gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Header gate
        run: bash scripts/check_headers.sh
      - name: Encoding gate
        run: bash scripts/check_encoding.sh
      - name: JavaScript behaviour gate
        shell: bash
        # The page scripts and the dashboard client are executed
        # against a fake DOM, not just parsed: their ref sweep, table
        # rules and reconnect reset are unreachable from a string
        # assertion. `node --test` is a builtin, so this adds no
        # dependency; the gate reports "skipped" without Node.
        run: bash scripts/check_js.sh
      - name: JavaScript syntax gate
        shell: bash
        # The dashboard and the Electron shell carry security-relevant
        # logic outside the Rust workspace; at minimum they must parse.
        run: |
          node --check frontend/src/app.js
          node --check browser/main.js
          node --check browser/preload.js
          node --check browser/scheme-gate.js
          node --check crates/observe/src/assets/reader.js
          node --check crates/observe/src/assets/serializer.js

  full-approval:
    name: full-approval (maintainer key)
    # Two-tier CI: cheap gates run on every event; the expensive tier below
    # runs only after a maintainer attaches the ci-approved label. This
    # guard FAILS (never pends) while unapproved, so the aggregate gate is
    # red with an actionable message instead of a hanging check. GitHub
    # forbids approving your own pull request, which makes an approval
    # review unusable as the key for a solo maintainer - a label carries
    # the same consent and works on the maintainer's own PRs too. Removing
    # the label re-arms the gate (unlabeled re-triggers this workflow).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "non-PR event ($EVENT): full CI runs unconditionally"
            exit 0
          fi
          if gh api "repos/$REPO/pulls/$PR_NUMBER" \
              --jq '[.labels[].name] | index("ci-approved") != null' | grep -q true; then
            echo "ci-approved label present: tier-2 unblocked"
            exit 0
          fi
          echo "::error title=Full CI awaiting approval::Tier-1 results are above; attach the ci-approved label to run the full suite (tier 2)."
          exit 1

  quality:
    name: fmt, clippy, doc, tests (${{ matrix.os }})
    needs: [changes, full-approval]
    # Tier 2: full approval plus the rust path flag (the labeled event
    # carries no classifier output, so the key runs the tier in full).
    if: ${{ always() && needs.full-approval.result == 'success' && (needs.changes.outputs.rust != 'false' || github.event.action == 'labeled') }}
    strategy:
      fail-fast: false
      matrix:
        # macOS compiles and tests the workspace because release
        # archives ship for it: the unix permission branches and the
        # non-Windows key paths otherwise never compile outside a
        # contributor's machine.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Doc
        run: cargo doc --locked --no-deps
      - name: Tests
        run: cargo test --locked --all

  integration:
    name: engine integration tests (${{ matrix.os }})
    needs: [changes, full-approval]
    # Tier 2: full approval plus the rust path flag (the labeled event
    # carries no classifier output, so the key runs the tier in full).
    if: ${{ always() && needs.full-approval.result == 'success' && (needs.changes.outputs.rust != 'false' || github.event.action == 'labeled') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/engine-setup
      - name: Integration tests
        run: cargo test --locked -p rutter-engine-cdp --tests -- --ignored

  e2e:
    name: e2e acceptance suites (${{ matrix.os }})
    needs: [changes, full-approval]
    # Tier 2: full approval plus the rust path flag (the labeled event
    # carries no classifier output, so the key runs the tier in full).
    if: ${{ always() && needs.full-approval.result == 'success' && (needs.changes.outputs.rust != 'false' || github.event.action == 'labeled') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/engine-setup
      - name: Build the binary the suites drive
        run: cargo build --locked --bin rutter
      - name: E2E suites
        run: cargo test --locked -p rutter-integration-tests --tests -- --ignored

  coverage:
    name: coverage >= 90 % lines
    needs: [changes, full-approval]
    # Tier 2: full approval plus the rust path flag (the labeled event
    # carries no classifier output, so the key runs the tier in full).
    if: ${{ always() && needs.full-approval.result == 'success' && (needs.changes.outputs.rust != 'false' || github.event.action == 'labeled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/engine-setup
      - name: Measure (engine suites and e2e included)
        run: |
          export RUTTER_BIN="$PWD/target/llvm-cov-target/debug/rutter"
          cargo llvm-cov --locked --workspace --bins --tests --lcov \
            --output-path target/coverage.lcov \
            -- --include-ignored --test-threads=1
      - name: Gate
        run: bash scripts/check_coverage.sh target/coverage.lcov 90

  msrv:
    name: msrv 1.88
    needs: [changes, full-approval]
    # Tier 2: full approval plus the rust path flag (the labeled event
    # carries no classifier output, so the key runs the tier in full).
    if: ${{ always() && needs.full-approval.result == 'success' && (needs.changes.outputs.rust != 'false' || github.event.action == 'labeled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check
        run: cargo check --locked --workspace --all-targets

  deny:
    name: cargo-deny
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  npm-audit:
    name: npm audit (browser shell)
    needs: changes
    if: ${{ always() && needs.changes.outputs.js != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Electron shell is the workspace's only npm surface and the
      # production dependency set is empty, so the --omit=dev audit is
      # a cheap hard gate. The full audit stays informational: its
      # current findings sit inside Electron itself (via extract-zip)
      # and are only resolvable by an Electron major bump, which is a
      # deliberate pairing decision with the engine's Chrome for
      # Testing line (see browser/README.md).
      - name: Production dependencies (blocking)
        run: npm --prefix browser audit --omit=dev
      - name: Full report including dev dependencies
        continue-on-error: true
        run: npm --prefix browser audit

  gate:
    # Merge-time summary: branch protection requires this check. Always runs;
    # passes when every job that ran succeeded (skipped areas are the path
    # triage doing its job) and fails on any failure or cancellation, so a
    # cancelled run can never masquerade as green. Future jobs join the needs
    # list; the required-checks entry never changes.
    name: gate
    needs: [changes, title, gates, quality, integration, e2e, coverage, msrv, deny, npm-audit, full-approval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate gate results
        env:
          CHANGES: ${{ needs.changes.result }}
          TITLE: ${{ needs.title.result }}
          GATES: ${{ needs.gates.result }}
          QUALITY: ${{ needs.quality.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
          COVERAGE: ${{ needs.coverage.result }}
          MSRV: ${{ needs.msrv.result }}
          DENY: ${{ needs.deny.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          FULL_APPROVAL: ${{ needs.full-approval.result }}
        run: |
          set -euo pipefail
          results="changes=$CHANGES title=$TITLE gates=$GATES quality=$QUALITY integration=$INTEGRATION e2e=$E2E coverage=$COVERAGE msrv=$MSRV deny=$DENY npm_audit=$NPM_AUDIT full_approval=$FULL_APPROVAL"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all triggered gates passed"
