# Continuous integration: the release gates run on
# every push and pull request. The engine jobs share one composite
# action (engine cache + Linux engine dependencies); the integration
# and e2e jobs drive the real Chrome for Testing engine, and the
# coverage job measures the whole workspace — engine suites and e2e
# included — against the 90 % line threshold of
# scripts/check_coverage.sh.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# An updated pull_request run cancels the superseded one; push runs
# queue behind the running one instead, and finished jobs keep their
# results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: fmt, clippy, doc, tests, gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS compiles and tests the workspace because release
        # archives ship for it: the unix permission branches and the
        # non-Windows key paths otherwise never compile outside a
        # contributor's machine.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: 6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Doc
        run: cargo doc --locked --no-deps
      - name: Tests
        run: cargo test --locked --all
      - name: Header gate
        run: bash scripts/check_headers.sh
      - name: Encoding gate
        run: bash scripts/check_encoding.sh
      - name: JavaScript behaviour gate
        shell: bash
        # The page scripts and the dashboard client are executed
        # against a fake DOM, not just parsed: their ref sweep, table
        # rules and reconnect reset are unreachable from a string
        # assertion. `node --test` is a builtin, so this adds no
        # dependency; the gate reports "skipped" without Node.
        run: bash scripts/check_js.sh
      - name: JavaScript syntax gate
        shell: bash
        # The dashboard and the Electron shell carry security-relevant
        # logic outside the Rust workspace; at minimum they must parse.
        run: |
          node --check frontend/src/app.js
          node --check browser/main.js
          node --check browser/preload.js
          node --check browser/scheme-gate.js
          node --check crates/observe/src/assets/reader.js
          node --check crates/observe/src/assets/serializer.js

  integration:
    name: engine integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: 6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/engine-setup
      - name: Integration tests
        run: cargo test --locked -p rutter-engine-cdp --tests -- --ignored

  e2e:
    name: e2e acceptance suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: 6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/engine-setup
      - name: Build the binary the suites drive
        run: cargo build --locked --bin rutter
      - name: E2E suites
        run: cargo test --locked -p rutter-integration-tests --tests -- --ignored

  coverage:
    name: coverage >= 90 % lines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: 6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/engine-setup
      - name: Measure (engine suites and e2e included)
        run: |
          export RUTTER_BIN="$PWD/target/llvm-cov-target/debug/rutter"
          cargo llvm-cov --locked --workspace --bins --tests --lcov \
            --output-path target/coverage.lcov \
            -- --include-ignored --test-threads=1
      - name: Gate
        run: bash scripts/check_coverage.sh target/coverage.lcov 90

  msrv:
    name: msrv 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: 6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check
        run: cargo check --locked --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: 3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  npm-audit:
    name: npm audit (browser shell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Electron shell is the workspace's only npm surface and the
      # production dependency set is empty, so the --omit=dev audit is
      # a cheap hard gate. The full audit stays informational: its
      # current findings sit inside Electron itself (via extract-zip)
      # and are only resolvable by an Electron major bump, which is a
      # deliberate pairing decision with the engine's Chrome for
      # Testing line (see browser/README.md).
      - name: Production dependencies (blocking)
        run: npm --prefix browser audit --omit=dev
      - name: Full report including dev dependencies
        continue-on-error: true
        run: npm --prefix browser audit
