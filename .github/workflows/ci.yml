# Continuous integration: the release gates of docs/testing.md run on
# every push and pull request. The integration job downloads the real
# Chrome for Testing engine (cached by version+platform) and runs the
# ignored engine tests.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: fmt, clippy, tests, gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all
      - name: Header gate
        run: bash scripts/check_headers.sh
      - name: Encoding gate
        run: bash scripts/check_encoding.sh

  integration:
    name: engine integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the engine binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rutter-engine-cache
          key: engine-${{ matrix.os }}-v1
          restore-keys: engine-${{ matrix.os }}-
      - name: Linux engine dependencies
        if: runner.os == 'Linux'
        run: |
          # chrome-headless-shell links libraries the hosted image does
          # not guarantee, and Ubuntu 24.04 blocks the Chromium
          # namespace sandbox for unprivileged binaries that ship no
          # AppArmor profile — the ephemeral runner can lift that for
          # the job's lifetime.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatspi2.0-0t64 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 \
            libglib2.0-0t64 libnspr4 libnss3 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 \
            libpango-1.0-0 libcairo2
      - name: Integration tests
        run: cargo test --locked -p rutter-engine-cdp --test integration -- --ignored

  msrv:
    name: msrv 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
