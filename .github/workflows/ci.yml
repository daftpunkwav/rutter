# Continuous integration: the release gates of blueprint §9 run on
# every push and pull request. The integration job downloads the real
# Chrome for Testing engine (cached by version+platform) and runs the
# ignored engine tests.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: fmt, clippy, tests, gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all
      - name: Header gate
        run: bash scripts/check_headers.sh
      - name: Encoding gate
        run: bash scripts/check_encoding.sh

  integration:
    name: engine integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUTTER_CACHE_DIR: ${{ github.workspace }}/.rutter-engine-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the engine binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rutter-engine-cache
          key: engine-${{ matrix.os }}-v1
          restore-keys: engine-${{ matrix.os }}-
      - name: Integration tests
        run: cargo test --locked -p rutter-engine-cdp --test integration -- --ignored

  msrv:
    name: msrv 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
